      description: "\u0927\u093E\u0930\u093E 11.2: \u092A\u094D\u0930\u0915\u093E\u0936 \u0938\u0940\u0927\u0940 \u0930\u0947\u0916\u093E \u092E\u0947\u0902 \u0917\u092E\u0928 \u0915\u0930\u0924\u093E \u0939\u0948\u0964 \u092F\u0926\u093F \u0939\u092E \u090F\u0915 \u0938\u0940\u0927 \u092E\u0947\u0902 \u091B\u0947\u0926 \u0935\u093E\u0932\u0947 \u0915\u093E\u0930\u094D\u0921\u092C\u094B\u0930\u094D\u0921 \u0930\u0916\u0924\u0947 \u0939\u0948\u0902, \u0924\u094B \u092A\u094D\u0930\u0915\u093E\u0936 \u0917\u0941\u091C\u0930\u0924\u093E \u0939\u0948\u0964 \u092F\u0926\u093F \u090F\u0915 \u0915\u093E\u0930\u094D\u0921\u092C\u094B\u0930\u094D\u0921 \u0915\u094B \u0939\u091F\u093E \u0926\u093F\u092F\u093E \u091C\u093E\u090F, \u0924\u094B \u092E\u093E\u0930\u094D\u0917 \u0905\u0935\u0930\u0941\u0926\u094D\u0927 \u0939\u094B \u091C\u093E\u0924\u093E \u0939\u0948\u0964",
      audioSrc: "assets/audio_11_2_hi.mp3",
      fullText: "\u091C\u092C \u0906\u092A \u090F\u0915 \u0938\u0940\u0927\u0940 \u092A\u093E\u0907\u092A \u0915\u0947 \u092E\u093E\u0927\u094D\u092F\u092E \u0938\u0947 \u092E\u094B\u092E\u092C\u0924\u094D\u0924\u0940 \u0915\u0940 \u0932\u094C \u0915\u094B \u0926\u0947\u0916\u0928\u0947 \u0915\u0940 \u0915\u094B\u0936\u093F\u0936 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902, \u0924\u094B \u0906\u092A \u0906\u0938\u093E\u0928\u0940 \u0938\u0947 \u092A\u094D\u0930\u0915\u093E\u0936 \u0926\u0947\u0916 \u0938\u0915\u0924\u0947 \u0939\u0948\u0902\u0964 \u0939\u093E\u0932\u093E\u0902\u0915\u093F, \u092F\u0926\u093F \u0906\u092A \u092A\u093E\u0907\u092A \u0915\u094B \u092E\u094B\u0921\u093C\u0924\u0947 \u0939\u0948\u0902, \u0924\u094B \u0906\u092A \u092E\u094B\u092E\u092C\u0924\u094D\u0924\u0940 \u0915\u0940 \u0932\u094C \u0915\u094B \u0928\u0939\u0940\u0902 \u0926\u0947\u0916 \u092A\u093E\u090F\u0902\u0917\u0947!\n\n\u0907\u0938\u0940 \u0924\u0930\u0939, \u092F\u0926\u093F \u0939\u092E \u0924\u0940\u0928 \u092E\u093E\u091A\u093F\u0938 \u0915\u0940 \u0921\u093F\u092C\u094D\u092C\u093F\u092F\u094B\u0902 \u0915\u094B \u092C\u093F\u0932\u094D\u0915\u0941\u0932 \u090F\u0915 \u0938\u0940\u0927\u0940 \u0930\u0947\u0916\u093E \u092E\u0947\u0902 \u0938\u094D\u0925\u093F\u0924 \u091B\u0947\u0926\u094B\u0902 \u0915\u0947 \u0938\u093E\u0925 \u0930\u0916\u0924\u0947 \u0939\u0948\u0902, \u0924\u094B \u091F\u0949\u0930\u094D\u091A \u0915\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u0909\u0928 \u0938\u092D\u0940 \u0938\u0947 \u0939\u094B\u0924\u0947 \u0939\u0941\u090F \u090F\u0915 \u0938\u094D\u0915\u094D\u0930\u0940\u0928 \u092A\u0930 \u090F\u0915 \u091A\u092E\u0915\u0940\u0932\u093E \u092C\u093F\u0902\u0926\u0941 \u092C\u0928\u093E\u0924\u093E \u0939\u0948\u0964 \u0932\u0947\u0915\u093F\u0928 \u092F\u0926\u093F \u0939\u092E \u090F\u0915 \u092E\u093E\u091A\u093F\u0938 \u0915\u0940 \u0921\u093F\u092C\u094D\u092C\u0940 \u0915\u094B \u092D\u0940 \u0925\u094B\u0921\u093C\u093E \u0938\u093E \u0932\u093E\u0907\u0928 \u0938\u0947 \u0939\u091F\u093E \u0926\u0947\u0902, \u0924\u094B \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u093E \u092C\u093F\u0902\u0926\u0941 \u0917\u093E\u092F\u092C \u0939\u094B \u091C\u093E\u0924\u093E \u0939\u0948\u0964\n\n\u092F\u0947 \u092A\u094D\u0930\u092F\u094B\u0917 \u0938\u094D\u092A\u0937\u094D\u091F \u0930\u0942\u092A \u0938\u0947 \u092A\u094D\u0930\u0915\u0943\u0924\u093F \u0915\u0947 \u090F\u0915 \u092E\u094C\u0932\u093F\u0915 \u0928\u093F\u092F\u092E \u0915\u094B \u0938\u093F\u0926\u094D\u0927 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902: \u092A\u094D\u0930\u0915\u093E\u0936 \u0939\u092E\u0947\u0936\u093E \u090F\u0915 \u0938\u0940\u0927\u0940 \u0930\u0947\u0916\u093E \u092E\u0947\u0902 \u0917\u092E\u0928 \u0915\u0930\u0924\u093E \u0939\u0948\u0964",

      description: "\u0927\u093E\u0930\u093E 11.3: \u0938\u093E\u092E\u0917\u094D\u0930\u0940 \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u0947 \u0938\u093E\u0925 \u0905\u0932\u0917 \u0924\u0930\u0939 \u0938\u0947 \u0915\u094D\u0930\u093F\u092F\u093E \u0915\u0930\u0924\u0940 \u0939\u0948\u0964 \u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940 \u0938\u093E\u092E\u0917\u094D\u0930\u0940 \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u094B \u092A\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0917\u0941\u091C\u0930\u0928\u0947 \u0926\u0947\u0924\u0940 \u0939\u0948, \u092A\u093E\u0930\u092D\u093E\u0938\u0940 \u0909\u0938\u0947 \u092B\u0948\u0932\u093E \u0926\u0947\u0924\u0940 \u0939\u0948, \u0914\u0930 \u0905\u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940 \u0909\u0938\u0947 \u092A\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0930\u094B\u0915 \u0926\u0947\u0924\u0940 \u0939\u0948\u0964",

      fullText: "\u0938\u093E\u092E\u0917\u094D\u0930\u0940 \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u0947 \u0938\u093E\u0925 \u0924\u0940\u0928 \u0905\u0932\u0917-\u0905\u0932\u0917 \u0924\u0930\u0940\u0915\u094B\u0902 \u0938\u0947 \u0915\u094D\u0930\u093F\u092F\u093E \u0915\u0930\u0924\u0940 \u0939\u0948:\n\n1. \u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940: \u0938\u093E\u092B \u0915\u093E\u0902\u091A \u0914\u0930 \u0939\u0935\u093E \u091C\u0948\u0938\u0940 \u0938\u093E\u092E\u0917\u094D\u0930\u0940 \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u094B \u092A\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0909\u0928\u0915\u0947 \u092E\u093E\u0927\u094D\u092F\u092E \u0938\u0947 \u0917\u0941\u091C\u0930\u0928\u0947 \u0926\u0947\u0924\u0940 \u0939\u0948, \u0924\u093E\u0915\u093F \u0939\u092E \u0909\u0928\u0915\u0947 \u092E\u093E\u0927\u094D\u092F\u092E \u0938\u0947 \u0935\u0938\u094D\u0924\u0941\u0913\u0902 \u0915\u094B \u0938\u094D\u092A\u0937\u094D\u091F \u0930\u0942\u092A \u0938\u0947 \u0926\u0947\u0916 \u0938\u0915\u0947\u0902\u0964\n\n2. \u092A\u093E\u0930\u092D\u093E\u0938\u0940: \u092B\u094D\u0930\u0949\u0938\u094D\u091F\u0947\u0921 \u0915\u093E\u0902\u091A \u092F\u093E \u091F\u094D\u0930\u0947\u0938\u093F\u0902\u0917 \u092A\u0947\u092A\u0930 \u091C\u0948\u0938\u0940 \u0938\u093E\u092E\u0917\u094D\u0930\u0940 \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u0947 \u0915\u0947\u0935\u0932 \u0906\u0902\u0936\u093F\u0915 \u0939\u093F\u0938\u094D\u0938\u0947 \u0915\u094B \u0939\u0940 \u0909\u0928\u0915\u0947 \u092E\u093E\u0927\u094D\u092F\u092E \u0938\u0947 \u0917\u0941\u091C\u0930\u0928\u0947 \u0926\u0947\u0924\u0940 \u0939\u0948\u0964 \u0939\u092E \u0909\u0928\u0915\u0947 \u092E\u093E\u0927\u094D\u092F\u092E \u0938\u0947 \u0926\u0947\u0916 \u0938\u0915\u0924\u0947 \u0939\u0948\u0902, \u0932\u0947\u0915\u093F\u0928 \u0938\u094D\u092A\u0937\u094D\u091F \u0930\u0942\u092A \u0938\u0947 \u0928\u0939\u0940\u0902\u0964\n\n3. \u0905\u092A\u093E\u0930\u0926\u0930\u094D\       audioSrc: "assets/audio_11_4_hi.mp3",
      fullText: "\u090F\u0915 \u091B\u093E\u092F\u093E \u0924\u092C \u092C\u0928\u0924\u0940 \u0939\u0948 \u091C\u092C \u0915\u094B\u0908 \u0905\u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940 \u0935\u0938\u094D\u0924\u0941 \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u0947 \u092E\u093E\u0930\u094D\u0917 \u092E\u0947\u0902 \u0906\u0924\u0940 \u0939\u0948, \u0914\u0930 \u0909\u0938\u0947 \u0938\u094D\u0915\u094D\u0930\u0940\u0928 (\u091C\u0948\u0938\u0947 \u092B\u0930\u094D\u0936 \u092F\u093E \u0926\u0940\u0935\u093E\u0930) \u092A\u0930 \u092A\u0921\u093C\u0928\u0947 \u0938\u0947 \u0930\u094B\u0915\u0924\u0940 \u0939\u0948\u0964 \u091B\u093E\u092F\u093E \u0926\u0947\u0916\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F, \u0939\u092E\u0947\u0902 \u0924\u0940\u0928 \u091A\u0940\u091C\u094B\u0902 \u0915\u0940 \u0906\u0935\u0936\u094D\u092F\u0915\u0924\u093E \u0939\u094B\u0924\u0940 \u0939\u0948: \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u093E \u0938\u094D\u0930\u094B\u0924, \u090F\u0915 \u0905\u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940 \u0935\u0938\u094D\u0924\u0941, \u0914\u0930 \u090F\u0915 \u0938\u094D\u0915\u094D\u0930\u0940\u0928\u0964\n\n\u091B\u093E\u092F\u093E \u0915\u093E \u0906\u0915\u093E\u0930, \u0906\u0915\u0943\u0924\u093F \u0914\u0930 \u0938\u094D\u092A\u0937\u094D\u091F\u0924\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u0938\u094D\u0930\u094B\u0924 \u0915\u0947 \u0938\u0902\u092C\u0902\u0927 \u092E\u0947\u0902 \u0935\u0938\u094D\u0924\u0941 \u0915\u0940 \u0938\u094D\u0925\u093F\u0924\u093F \u092A\u0930 \u0928\u093F\u0930\u094D\u092D\u0930 \u0915\u0930\u0924\u0940 \u0939\u0948\u0964 \u092F\u0926\u093F \u0906\u092A \u0915\u093F\u0938\u0940 \u0935\u0938\u094D\u0924\u0941 \u0915\u094B \u092A\u094D\u0930\u0915\u093E\u0936 \u0938\u094D\u0930\u094B\u0924 \u0915\u0947 \u092C\u0939\u0941\u0924 \u0915\u0930\u0940\u092C \u0932\u0947 \u091C\u093E\u0924\u0947 \u0939\u0948\u0902, \u0924\u094B \u092F\u0939 \u0905\u0927\u093F\u0915 \u0915\u093F\u0930\u0923\u094B\u0902
