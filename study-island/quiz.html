                { id: 'q3_12', text: "Why do airplanes flying high in the sky rarely cast a visible shadow on the ground?", options: ["Planes are transparent.", "They fly faster than light.", "The shadow becomes too blurry and scattered to see from that distance (penumbra effect).", "The sun is too bright up there."], correct: 2, hint: "The farther away, the softer the shadow gets until it fades.", explanation: "Due to the vast distance from the ground, the sunlight scatters around the plane, causing the shadow to blur entirely before reaching the surface.", icon: "plane" },

                'q4_20': { t: "├á┬ñ┬¬├á┬Ñ┬ì├á┬ñ┬░├á┬ñ┬¥├á┬ñ┼í├á┬ÑÔé¼├á┬ñ┬¿ ├á┬ñ┬▓├á┬ÑÔÇ╣├á┬ñÔÇö ├á┬ñÔÇª├á┬ñÔÇó├á┬Ñ┬ì├á┬ñ┬©├á┬ñ┬░ ├á┬ñ┬©├á┬ÑÔÇÜ├á┬ñ┬░├á┬Ñ┬ì├á┬ñ┬» ├á┬ñÔÇö├á┬Ñ┬ì├á┬ñ┬░├á┬ñ┬╣├á┬ñ┬ú ├á┬ñ┬©├á┬ÑÔÇí ├á┬ñ┬¡├á┬ñ┬»├á┬ñ┬¡├á┬ÑÔé¼├á┬ñ┬ñ ├á┬ñ┬╣├á┬ÑÔÇ╣├á┬ñ┬ñ├á┬ÑÔÇí ├á┬ñ┬Ñ├á┬ÑÔÇí ├á┬ñÔÇó├á┬Ñ┬ì├á┬ñ┬»├á┬ÑÔÇ╣├á┬ñÔÇÜ├á┬ñÔÇó├á┬ñ┬┐...", o: ["├á┬ñ┬Á├á┬ÑÔÇí ├á┬ñÔÇô├á┬ñ┬░├á┬ñ┬¥├á┬ñ┬¼ ├á┬ñ┬«├á┬Ñ┼Æ├á┬ñ┬©├á┬ñ┬« ├á┬ñÔÇó├á┬ñ┬¥ ├á┬ñÔÇó├á┬ñ┬¥├á┬ñ┬░├á┬ñ┬ú ├á┬ñ┬¼├á┬ñ┬¿├á┬ÑÔÇí├á┬Ñ┬ñ", "├á┬ñÔÇ░├á┬ñ┬¿├á┬Ñ┬ì├á┬ñ┬╣├á┬ÑÔÇí├á┬ñÔÇÜ ├á┬ñ┬▓├á┬ñÔÇö├á┬ñ┬¥ ├á┬ñÔÇó├á┬ñ┬┐ ├á┬ñÔÇó├á┬ÑÔÇ╣├á┬ñ╦å ├á┬ñ┬░├á┬ñ┬¥├á┬ñÔÇó├á┬Ñ┬ì├á┬ñ┬À├á┬ñ┬© ├á┬ñ┬©├á┬ÑÔÇÜ├á┬ñ┬░├á┬ñ┼ô ├á┬ñÔÇô├á┬ñ┬¥ ├á┬ñ┬░├á┬ñ┬╣├á┬ñ┬¥ ├á┬ñ┬╣├á┬Ñ╦å ├á┬ñÔÇØ├á┬ñ┬░ ├á┬ñ┬Á├á┬ÑÔÇí ├á┬ñ┬Á├á┬ñ┬┐├á┬ñ┼ô├á┬Ñ┬ì├á┬ñ┼¥├á┬ñ┬¥├á┬ñ┬¿ ├á┬ñÔÇó├á┬ÑÔÇ╣ ├á┬ñ┬¿├á┬ñ┬╣├á┬ÑÔé¼├á┬ñÔÇÜ ├á┬ñ┬©├á┬ñ┬«├á┬ñ┬Ø├á┬ñ┬ñ├á┬ÑÔÇí ├á┬ñ┬╣├á┬Ñ╦å├á┬ñÔÇÜ├á┬Ñ┬ñ", "├á┬ñ┬Á├á┬ÑÔÇí ├á┬ñ┬¼├á┬ñ┬╣├á┬Ñ┬ü├á┬ñ┬ñ ├á┬ñ┼ô├á┬ÑÔÇ╣├á┬ñ┬░ ├á┬ñ┬©├á┬ÑÔÇí ├á┬ñ┬Ñ├á┬ÑÔÇí├á┬Ñ┬ñ", "├á┬ñ┬Á├á┬ÑÔÇí ├á┬ñ┬╣├á┬ñ┬«├á┬ÑÔÇí├á┬ñ┬Â├á┬ñ┬¥ ├á┬ñ┬¡├á┬ÑÔÇÜ├á┬ñÔÇó├á┬ñÔÇÜ├á┬ñ┬¬ ├á┬ñÔÇó├á┬ñ┬¥ ├á┬ñÔÇó├á┬ñ┬¥├á┬ñ┬░├á┬ñ┬ú ├á┬ñ┬¼├á┬ñ┬¿├á┬ÑÔÇí├á┬Ñ┬ñ"], h: "├á┬ñ┬¼├á┬ñ┬┐├á┬ñ┬¿├á┬ñ┬¥ ├á┬ñÔÇó├á┬ñ┬┐├á┬ñ┬©├á┬ÑÔé¼ ├á┬ñ┼í├á┬ÑÔÇí├á┬ñ┬ñ├á┬ñ┬¥├á┬ñ┬Á├á┬ñ┬¿├á┬ÑÔé¼ ├á┬ñÔÇó├á┬ÑÔÇí ├á┬ñ┬©├á┬ÑÔÇÜ├á┬ñ┬░├á┬ñ┼ô ├á┬ñÔÇó├á┬ÑÔÇí ├á┬ñÔÇö├á┬ñ┬¥├á┬ñ┬»├á┬ñ┬¼ ├á┬ñ┬╣├á┬ÑÔÇ╣├á┬ñ┬¿├á┬ÑÔÇí ├á┬ñÔÇó├á┬ÑÔé¼ ├á┬ñÔÇó├á┬ñ┬▓├á┬Ñ┬ì├á┬ñ┬¬├á┬ñ┬¿├á┬ñ┬¥ ├á┬ñÔÇó├á┬ñ┬░├á┬ÑÔÇí├á┬ñÔÇÜ├á┬Ñ┬ñ", e: "├á┬ñÔÇá├á┬ñ┬º├á┬Ñ┬ü├á┬ñ┬¿├á┬ñ┬┐├á┬ñÔÇó ├á┬ñÔÇô├á┬ñÔÇö├á┬ÑÔÇ╣├á┬ñ┬▓├á┬ÑÔé¼├á┬ñ┬» ├á┬ñ┼ô├á┬Ñ┬ì├á┬ñ┼¥├á┬ñ┬¥├á┬ñ┬¿ ├á┬ñÔÇó├á┬ÑÔÇí ├á┬ñ┬¼├á┬ñ┬┐├á┬ñ┬¿├á┬ñ┬¥, ├á┬ñ┼ô├á┬ÑÔé¼├á┬ñ┬Á├á┬ñ┬¿ ├á┬ñ┬ª├á┬ÑÔÇí├á┬ñ┬¿├á┬ÑÔÇí ├á┬ñ┬Á├á┬ñ┬¥├á┬ñ┬▓├á┬ÑÔÇí ├á┬ñ┬©├á┬ÑÔÇÜ├á┬ñ┬░├á┬Ñ┬ì├á┬ñ┬» ├á┬ñÔÇó├á┬ñ┬¥ ├á┬ñÔÇª├á┬ñ┼í├á┬ñ┬¥├á┬ñ┬¿├á┬ñÔÇó, ├á┬ñÔÇª├á┬ñ┬©├á┬Ñ┬ì├á┬ñ┬¬├á┬ñ┬À├á┬Ñ┬ì├á┬ñ┼©├á┬ÑÔé¼├á┬ñÔÇó├á┬ÑãÆ├á┬ñ┬ñ ├á┬ñÔÇö├á┬ñ┬¥├á┬ñ┬»├á┬ñ┬¼ ├á┬ñ┬╣├á┬ÑÔÇ╣├á┬ñ┬¿├á┬ñ┬¥ ├á┬ñ┬¡├á┬ñ┬»├á┬ñ┬¥├á┬ñ┬¿├á┬ñÔÇó ├á┬ñ┬Ñ├á┬ñ┬¥ ├á┬ñÔÇØ├á┬ñ┬░ ├á┬ñÔÇª├á┬ñÔÇó├á┬Ñ┬ì├á┬ñ┬©├á┬ñ┬░ ├á┬ñ┬¬├á┬Ñ┼Æ├á┬ñ┬░├á┬ñ┬¥├á┬ñ┬ú├á┬ñ┬┐├á┬ñÔÇó ├á┬ñ┼ô├á┬ñ┬¥├á┬ñ┬¿├á┬ñ┬Á├á┬ñ┬░├á┬ÑÔÇ╣├á┬ñÔÇÜ ├á┬ñÔÇó├á┬ÑÔÇ╣ ├á┬ñ┬ª├á┬ÑÔÇ╣├á┬ñ┬À├á┬ÑÔé¼ ├á┬ñ┬á├á┬ñ┬╣├á┬ñ┬░├á┬ñ┬¥├á┬ñ┬»├á┬ñ┬¥ ├á┬ñ┼ô├á┬ñ┬¥├á┬ñ┬ñ├á┬ñ┬¥ ├á┬ñ┬Ñ├á┬ñ┬¥├á┬Ñ┬ñ" }
            }
        };

        const getTranslatedQuestion = (q, lang) => {
            if (lang === 'en') return q;
            if (exactTranslations[lang] && exactTranslations[lang][q.id]) {
                const data = exactTranslations[lang][q.id];
                return { ...q, text: data.t, options: data.o, hint: data.h, explanation: data.e };
            }
            return {
                ...q,
                text: `[${lang.toUpperCase()}] ${q.text}`,
                options: q.options.map(opt => `[${lang.toUpperCase()}] ${opt}`),
                hint: `[${lang.toUpperCase()}] ${q.hint}`,
                explanation: q.explanation
            };
        };

        // --- AUDIO SYNTHESIZER ---
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.03);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.03);
                    osc.start(); osc.stop(ctx.currentTime + 0.03);
                } else if (type === 'select') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'complete') {
                    const freqs = [523.25, 659.25, 783.99, 1046.50]; 
                    freqs.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.type = 'sine'; osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.08);
                        gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + i * 0.08 + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 0.4);
                        osc.start(ctx.currentTime + i * 0.08); osc.stop(ctx.currentTime + i * 0.08 + 0.4);
                    });
                }
            } catch (e) { console.log("Audio skipped", e); }
        };

        const GlowOrb = ({ color, top, left, delay }) => (
            <div 
                className={`absolute rounded-full mix-blend-screen filter blur-[100px] opacity-40 animate-pulse-slow ${color}`}
                style={{ top, left, width: '40vw', height: '40vw', animationDelay: delay }}
            />
        );

        const SpringSlider = ({ scrollTargetRef }) => {
            const trackRef = useRef(null);
            const knobRef = useRef(null);
        
            useEffect(() => {
                const knob = knobRef.current;
                const track = trackRef.current;
                if (!knob || !track) return;
        
                let isDragging = false;
                let startY = 0;
                let currentOffset = 0;
                let maxOffset = 0;
                let animationFrameId = null;
        
                const scrollLoop = () => {
                    if (isDragging && currentOffset !== 0 && maxOffset > 0) {
                        // Scroll the target ref's element, or fall back to window
                        const target = scrollTargetRef && scrollTargetRef.current;
                        const speedFactor = currentOffset / maxOffset;
                        const maxSpeed = 22;
                        if (target) {
                            target.scrollTop += speedFactor * maxSpeed;
                        } else {
                            window.scrollBy({ top: speedFactor * maxSpeed, left: 0, behavior: 'instant' });
                        }
                    }
                    animationFrameId = requestAnimationFrame(scrollLoop);
                };
                
                scrollLoop();
        
                const onStart = (e) => {
                    isDragging = true;
                    const trackHeight = track.clientHeight;
                    const knobHeight = knob.clientHeight;
                    maxOffset = (trackHeight - knobHeight) / 2;
                    
                    knob.style.transition = 'none';
                    knob.classList.add('dragging');
                    
                    startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                };
        
                const onMove = (e) => {
                    if (!isDragging) return;
                    
                    const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                    let deltaY = clientY - startY;
                    
                    if (Math.abs(deltaY) > maxOffset) {
                        const excess = Math.abs(deltaY) - maxOffset;
                        const resistedExcess = excess * 0.3; 
                        deltaY = Math.sign(deltaY) * (maxOffset + resistedExcess);
                    }
                    
                    currentOffset = deltaY;
                    knob.style.transform = `translate(-50%, calc(-50% + ${currentOffset}px)) scale(1.1)`;
                };
        
                const onEnd = () => {
                    if (!isDragging) return;
                    isDragging = false;
                    
                    knob.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease';
                    knob.classList.remove('dragging');
                    
                    currentOffset = 0;
                    knob.style.transform = `translate(-50%, -50%) scale(1)`;
                };
        
                const handleTouchMove = (e) => {
                    if (isDragging) e.preventDefault();
                    onMove(e);
                };
        
                knob.addEventListener('mousedown', onStart);
                window.addEventListener('mousemove', onMove, { passive: false });
                window.addEventListener('mouseup', onEnd);
                
                knob.addEventListener('touchstart', onStart, { passive: true });
                window.addEventListener('touchmove', handleTouchMove, { passive: false });
                window.addEventListener('touchend', onEnd);
        
                return () => {
                    cancelAnimationFrame(animationFrameId);
                    knob.removeEventListener('mousedown', onStart);
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onEnd);
                    
                    knob.removeEventListener('touchstart', onStart);
                    window.removeEventListener('touchmove', handleTouchMove);
                    window.removeEventListener('touchend', onEnd);
                };
            }, [scrollTargetRef]);
        
            return (
                <div className="spring-slider-container" style={{ position: 'fixed' }}>
                    <div ref={trackRef} className="spring-slider-track">
                        <div ref={knobRef} className="spring-slider-knob">
                            <div className="knob-inner"></div>
                        </div>
                    </div>
                </div>
            );
        };

        // Array shuffler utility
        const shuffleArray = (array) => {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            const [appState, setAppState] = useState('start'); // start, playing, review, results, analysis
            const [lang, setLang] = useState('en'); 
            const [mode, setMode] = useState('untimed'); 
            const [currentSectionIdx, setCurrentSectionIdx] = useState(0);
            const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
            const [answers, setAnswers] = useState({}); 
            const [timeRemaining, setTimeRemaining] = useState(0); 
            const [timeStr, setTimeStr] = useState("10:02 AM"); 
            const [activeQuizData, setActiveQuizData] = useState(null); 
            const [showExitModal, setShowExitModal] = useState(false); 
            const [showSubmitModal, setShowSubmitModal] = useState(false);
            // Scroll refs for review and analysis screens (must be top-level, not inside conditionals)
            const reviewScrollRef = useRef(null);
            const analysisScrollRef = useRef(null);

            const ui = T[lang] || T.en;
            const currentSectionId = SECTIONS[currentSectionIdx].id;

            const DefaultAppBackground = () => (
                <>
                    <div className="fixed inset-0 pointer-events-none z-[-3]" style={{ backgroundImage: `url('assets/chapter%20background%20lowres.jpg')`, backgroundSize: 'cover', backgroundPosition: 'center', backgroundAttachment: 'fixed' }}></div>
                    <div className="fixed inset-0 pointer-events-none z-[-2]" style={{ background: 'rgba(0,0,0,0.30)' }}></div>
                    {/* Particle animations disabled for ARM GPU / smartboard */}
                </>
            );
            const questionsList = activeQuizData ? activeQuizData[currentSectionId] : [];
            const currentQuestion = questionsList ? questionsList[currentQuestionIdx] : null;
            const totalQuestions = activeQuizData ? Object.values(activeQuizData).reduce((acc, section) => acc + section.length, 0) : 0;
            const answeredCount = Object.keys(answers).length;

            const translatedSections = useMemo(() => getTranslatedSections(lang), [lang]);
            const translatedCurrentQuestion = useMemo(() => currentQuestion ? getTranslatedQuestion(currentQuestion, lang) : null, [currentQuestion, lang]);

            useEffect(() => {
                const timer = setInterval(() => {
                    const d = new Date();
                    setTimeStr(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
                }, 60000);
                const d = new Date();
                setTimeStr(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                let interval = null;
                if (appState === 'playing' && mode === 'timed' && timeRemaining > 0) {
                    interval = setInterval(() => { setTimeRemaining((prev) => prev - 1); }, 1000);
                } else if (appState === 'playing' && mode === 'timed' && timeRemaining === 0) {
                    setAppState('results');
                }
                return () => clearInterval(interval);
            }, [appState, mode, timeRemaining]);

            useEffect(() => {
                if (appState === 'results') playSound('complete');
            }, [appState]);

            const startGame = (selectedMode) => {
                playSound('click'); setMode(selectedMode);
                if (selectedMode === 'timed') setTimeRemaining(15 * 60); 
                
                const newQuizData = {};
                for (const sectionKey in QUIZ_DATA) {
                    const shuffledQs = shuffleArray(QUIZ_DATA[sectionKey]).slice(0, 10);
                    newQuizData[sectionKey] = shuffledQs.map(q => ({
                        ...q,
                        shuffledIndices: shuffleArray([0, 1, 2, 3])
                    }));
                }
                setActiveQuizData(newQuizData);
                
                setAppState('playing'); setAnswers({});
                setCurrentSectionIdx(0); setCurrentQuestionIdx(0);
            };

            const handleSelectOption = (originalIndex) => {
                playSound('select');
                setAnswers(prev => ({ ...prev, [currentQuestion.id]: originalIndex }));
            };

            const formatTime = (seconds) => {
                if (seconds === null || seconds === undefined) return "--:--";
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const handleNextArrow = () => {
                playSound('click');
                if (currentQuestionIdx < questionsList.length - 1) {
                    setCurrentQuestionIdx(prev => prev + 1);
                } else if (currentSectionIdx < SECTIONS.length - 1) {
                    setCurrentSectionIdx(prev => prev + 1);
                    setCurrentQuestionIdx(0);
                } else {
                    setAppState('review');
                }
            };

            const handlePrev = () => {
                playSound('click');
                if (currentQuestionIdx > 0) {
                    setCurrentQuestionIdx(prev => prev - 1);
                } else if (currentSectionIdx > 0) {
                    setCurrentSectionIdx(prev => prev - 1);
                    setCurrentQuestionIdx(activeQuizData[SECTIONS[currentSectionIdx - 1].id].length - 1);
                }
            };

            const handleMainAction = () => {
                playSound('click');
                const isLastQuestionInSection = currentQuestionIdx === questionsList.length - 1;
                const isLastSection = currentSectionIdx === SECTIONS.length - 1;

                if (!isLastQuestionInSection) {
                    setCurrentQuestionIdx(prev => prev + 1);
                } else if (isLastQuestionInSection && !isLastSection) {
                    setCurrentSectionIdx(prev => prev + 1);
                    setCurrentQuestionIdx(0);
                } else {
                    setAppState('review');
                }
            };

            const calculateTotalScore = () => {
                let score = 0;
                Object.entries(answers).forEach(([qId, ansIdx]) => {
                    for (const sectionKey in activeQuizData) {
                        const q = activeQuizData[sectionKey].find(item => item.id === qId);
                        if (q && q.correct === ansIdx) { score++; break; }
                    }
                });
                return score;
            };

            const handleBackClick = () => {
                playSound('click');
                setShowExitModal(true);
            };

            const confirmExit = () => {
                playSound('click');
                setShowExitModal(false);
                setAppState('start');
            };

            const cancelExit = () => {
                playSound('click');
                setShowExitModal(false);
            };

            const handleFinalSubmitClick = () => {
                playSound('click');
                setShowSubmitModal(true);
            };

            const confirmSubmit = () => {
                playSound('click');
                setShowSubmitModal(false);
                setAppState('results');
            };

            const cancelSubmit = () => {
                playSound('click');
                setShowSubmitModal(false);
            };

            const returnToPlatform = () => {
                playSound('click');
                // Use postMessage so the parent's closeOverlay() runs in full ├óÔé¼ÔÇØ
                // that function removes 'fullscreen-overlay-open' from document.body,
                // which is what was keeping the global nav hidden after returning.
                // Direct DOM manipulation (adding 'hidden' manually) skipped that
                // cleanup step and left the nav permanently invisible.
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage('closeOverlay', '*');
                } else {
                    // Fallback: if not in an iframe just reload to a safe state
                    window.location.href = 'index.html';
                }
            };

            // --- REUSABLE TOP NAVIGATION COMPONENT ---
            const renderTopNav = (showTime = true, backAction = handleBackClick, backText = ui.back) => (
                <header className="fixed top-0 left-0 right-0 z-50 flex justify-between items-center p-3 sm:p-6 gap-3 pointer-events-none">
                    <button onClick={backAction} className="pointer-events-auto flex items-center gap-2 px-3 sm:px-4 py-2 sm:py-2.5 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full transition-all text-white font-medium shadow-lg shrink-0">
                        <LucideIcon name="arrow-left" className="w-5 h-5 shrink-0" />
                        <span className="hidden sm:block whitespace-nowrap">{backText}</span>
                    </button>

                    {showTime && (
                        <div className="pointer-events-auto flex items-center gap-2 sm:gap-4 px-4 sm:px-6 py-2 sm:py-2.5 bg-white/10 backdrop-blur-md border border-white/20 rounded-full shadow-lg text-white shrink-0 max-w-[50%] overflow-hidden">
                            <div className="text-sm sm:text-xl font-light tracking-wide shrink-0 hidden md:block">{timeStr}</div>
                            <div className="w-px h-4 sm:h-6 bg-white/20 shrink-0 hidden md:block"></div>
                            {mode === 'timed' ? (
                                <div className="flex items-center gap-1.5 sm:gap-2 text-cyan-400">
                                    <LucideIcon name="timer" className="w-4 h-4 sm:w-5 sm:h-5 shrink-0" />
                                    <span className="text-sm sm:text-xl font-mono font-bold">{formatTime(timeRemaining)}</span>
                                </div>
                            ) : (
                                <div className="flex items-center gap-1.5 sm:gap-2 text-white/70">
                                    <LucideIcon name="infinity" className="w-4 h-4 sm:w-5 sm:h-5 shrink-0" />
                                    <span className="text-[10px] sm:text-xs uppercase tracking-widest font-medium whitespace-nowrap">{ui.zenMode}</span>
                                </div>
                            )}
                        </div>
                    )}
                </header>
            );

            const exitModalJSX = showExitModal ? (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" onClick={cancelExit}></div>
                    <div className="relative bg-slate-900 border border-white/20 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center animate-[pulse_0.2s_ease-out]">
                        <LucideIcon name="alert-triangle" className="w-16 h-16 text-red-500/80 mx-auto mb-4" />
                        <h3 className="text-2xl font-bold text-white mb-2">{ui.exitConfirm}</h3>
                        <p className="text-white/60 mb-8">{ui.exitWarning}</p>
                        <div className="flex gap-4">
                            <button onClick={cancelExit} className="flex-1 px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white font-medium transition-colors">
                                {ui.cancel}
                            </button>
                            <button onClick={confirmExit} className="flex-1 px-4 py-3 rounded-xl bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 font-medium transition-colors">
                                {ui.yesExit}
                            </button>
                        </div>
                    </div>
                </div>
            ) : null;

            const submitModalJSX = showSubmitModal ? (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" onClick={cancelSubmit}></div>
                    <div className="relative bg-slate-900 border border-cyan-500/30 p-8 rounded-3xl shadow-[0_0_40px_rgba(34,211,238,0.15)] max-w-sm w-full text-center animate-[pulse_0.2s_ease-out]">
                        <LucideIcon name="check-circle" className="w-16 h-16 text-cyan-400 mx-auto mb-4" />
                        <h3 className="text-2xl font-bold text-white mb-2">{ui.submitConfirm || T.en.submitConfirm}</h3>
                        <p className="text-white/60 mb-8">{ui.submitWarning || T.en.submitWarning}</p>
                        <div className="flex gap-4">
                            <button onClick={cancelSubmit} className="flex-1 px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white font-medium transition-colors">
                                {ui.cancel || T.en.cancel}
                            </button>
                            <button onClick={confirmSubmit} className="flex-1 px-4 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold transition-colors">
                                {ui.yesSubmit || T.en.yesSubmit}
                            </button>
                        </div>
                    </div>
                </div>
            ) : null;

            if (appState === 'start') {
                return (
                    <div className="min-h-screen w-full text-white font-sans flex items-center justify-center relative overflow-hidden">
                        <DefaultAppBackground />
                        
                        <div className="absolute top-4 sm:top-6 left-4 sm:left-6 z-30">
                            <button onClick={returnToPlatform} className="flex items-center gap-2 px-3 sm:px-4 py-2 sm:py-2.5 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-full transition-all text-white font-medium shadow-lg shrink-0">
                                <LucideIcon name="arrow-left" className="w-5 h-5 shrink-0" />
                                <span className="hidden sm:block whitespace-nowrap">Back</span>
                            </button>
                        </div>

                        <div className="absolute top-4 sm:top-6 right-4 sm:right-6 z-30 bg-white/10 backdrop-blur-md border border-white/20 rounded-full flex items-center px-4 py-2 shadow-lg group">
                            <LucideIcon name="globe" className="w-4 h-4 text-cyan-300 mr-2 group-hover:animate-spin" />
                            <select className="bg-transparent text-white text-sm outline-none cursor-pointer appearance-none pr-4" value={lang} onChange={(e) => { playSound('click'); setLang(e.target.value); }}>
                                {Object.entries(LANGUAGES).map(([key, val]) => (
                                    <option key={key} value={key} className="bg-slate-800 text-white">{val.name}</option>
                                ))}
                            </select>
                        </div>

                        <div className="z-10 glass-panel-card p-12 max-w-2xl text-center mx-4 w-[calc(100%-2rem)]">
                            <LucideIcon name="box" className="w-20 h-20 text-cyan-400 mx-auto mb-6 animate-bounce" />
                            <h1 className="text-4xl sm:text-5xl font-bold mb-4 tracking-tight">{ui.title}</h1>
                            <p className="text-xl sm:text-3xl font-semibold text-white/90 mb-10 tracking-wide">{ui.subtitle}</p>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <button onClick={() => startGame('untimed')} className="group relative bg-white/5 hover:bg-white/10 border border-white/10 p-8 rounded-2xl transition-all hover:scale-105">
                                    <LucideIcon name="infinity" className="w-12 h-12 text-blue-400 mx-auto mb-4 group-hover:animate-pulse" />
                                    <h3 className="text-2xl font-semibold">{ui.zenMode}</h3>
                                    <p className="text-sm text-white/50 mt-2">{ui.zenDesc}</p>
                                </button>
                                
                                <button onClick={() => startGame('timed')} className="group relative bg-cyan-900/30 hover:bg-cyan-800/40 border border-cyan-400/30 p-8 rounded-2xl transition-all hover:scale-105">
                                    <LucideIcon name="timer" className="w-12 h-12 text-cyan-400 mx-auto mb-4 group-hover:animate-spin" />
                                    <h3 className="text-2xl font-semibold">{ui.challengeMode}</h3>
                                    <p className="text-sm text-cyan-200/50 mt-2">{ui.challengeDesc}</p>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (appState === 'analysis') {
                return (
                    <div className="h-screen w-full text-white font-sans flex flex-col relative overflow-hidden">
                        <DefaultAppBackground />

                        {renderTopNav(false, () => { playSound('click'); setAppState('results'); }, ui.backToResults || T.en.backToResults)}

                        {/* Spring Slider scroll controller */}
                        <SpringSlider scrollTargetRef={analysisScrollRef} />

                        {/* Scrollable content ├óÔé¼ÔÇØ no native scrollbar, slider drives it */}
                        <div ref={analysisScrollRef} className="relative z-10 flex-1 overflow-y-auto overflow-x-hidden slider-scroll-container pt-20 pb-12 px-4 sm:px-6">
                            <div className="w-full max-w-4xl mx-auto">
                                <h2 className="text-3xl sm:text-4xl font-serif tracking-wide text-center mb-8 sm:mb-12 text-white/90">{ui.analysisTitle || T.en.analysisTitle}</h2>
                                <div className="space-y-8 sm:space-y-12">
                                    {SECTIONS.map((section, sIdx) => {
                                        const qList = activeQuizData[section.id];
                                        return (
                                            <div key={section.id} className="glass-panel-card p-6 sm:p-8">
                                                <h3 className="text-xl sm:text-2xl font-serif tracking-wide text-cyan-400 mb-6 sm:mb-8 border-b border-white/10 pb-4 flex items-center gap-3">
                                                    <LucideIcon name={section.icon} className="w-5 h-5 sm:w-6 sm:h-6 shrink-0" />
                                                    {translatedSections[sIdx].title.toUpperCase()}
                                                </h3>
                                                <div className="space-y-6 sm:space-y-8">
                                                    {qList.map((q, qIdx) => {
                                                        const transQ = getTranslatedQuestion(q, lang);
                                                        const userAnsIdx = answers[q.id];
                                                        const isCorrect = userAnsIdx === q.correct;
                                                        
                                                        return (
                                                            <div key={q.id} className="bg-black/20 rounded-2xl sm:rounded-3xl p-4 sm:p-6 border border-white/5 relative">
                                                                {/* Correct/Incorrect icon indicator */}
                                                                <div className={`absolute -top-3 -right-3 sm:-top-4 sm:-right-4 w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center shadow-lg border-2 sm:border-4 border-slate-900 ${userAnsIdx === undefined ? 'bg-slate-500' : (isCorrect ? 'bg-green-500' : 'bg-red-500')}`}>
                                                                    <LucideIcon name={userAnsIdx === undefined ? "minus" : (isCorrect ? "check" : "x")} className="w-4 h-4 sm:w-5 sm:h-5 text-slate-900" />
                                                                </div>

                                                                <p className="text-lg sm:text-xl leading-relaxed text-white/90 font-medium mb-6 pr-4">
                                                                    <span className="font-bold text-cyan-300 mr-2">Q{qIdx + 1}.</span>{transQ.text}
                                                                </p>

                                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4 mb-6">
                                                                    {q.shuffledIndices.map((origIdx, rIdx) => {
                                                                        const optText = transQ.options[origIdx];
                                                                        let btnClass = "bg-white/5 border-white/10 text-white/60";
                                                                        let iconName = null;
                                                                        let iconColor = "";

                                                                        if (origIdx === q.correct) {
                                                                            btnClass = "bg-green-500/20 border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.2)] text-green-100";
                                                                            iconName = "check-circle-2";
                                                                            iconColor = "text-green-400";
                                                                        } else if (origIdx === userAnsIdx && origIdx !== q.correct) {
                                                                            btnClass = "bg-red-500/20 border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.2)] text-red-100";
                                                                            iconName = "x-circle";
                                                                            iconColor = "text-red-400";
                                                                        }

                                                                        return (
                                                                            <div key={rIdx} className={`relative overflow-hidden flex items-center p-3 sm:p-4 rounded-xl sm:rounded-2xl border ${btnClass}`}>
                                                                                <span className="w-6 h-6 sm:w-8 sm:h-8 rounded-full flex items-center justify-center mr-3 bg-black/20 shrink-0 text-sm sm:text-base">{rIdx + 1}</span>
                                                                                <span className="text-sm sm:text-base leading-snug">{optText}</span>
                                                                                {iconName && <LucideIcon name={iconName} className={`w-4 h-4 sm:w-5 sm:h-5 ml-auto shrink-0 ${iconColor}`} />}
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>

                                                                <div className="bg-cyan-900/30 border border-cyan-500/20 p-4 sm:p-5 rounded-xl sm:rounded-2xl flex flex-col gap-2 sm:gap-3 text-cyan-100">
                                                                    <div className="flex items-center gap-2">
                                                                        <LucideIcon name="lightbulb" className="w-5 h-5 text-cyan-400 shrink-0" />
                                                                        <span className="font-bold text-sm sm:text-base">{ui.explanationLabel || 'Explanation'}</span>
                                                                    </div>
                                                                    <p className="text-sm leading-relaxed">{transQ.explanation || transQ.hint || transQ.e}</p>
                                                                </div>
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                )
            }

            if (appState === 'review') {
                return (
                    <div className="h-screen w-full text-white font-sans flex flex-col relative overflow-hidden">
                        <DefaultAppBackground />

                        {renderTopNav(true, handleBackClick, ui.back || T.en.back)}

                        {/* Spring Slider scroll controller */}
                        <SpringSlider scrollTargetRef={reviewScrollRef} />

                        <div ref={reviewScrollRef} className="relative z-10 flex-1 overflow-y-auto overflow-x-hidden slider-scroll-container pt-20 pb-12 px-4 sm:px-6 flex justify-center">
                        <div className="w-full max-w-4xl glass-panel-card p-6 sm:p-8 md:p-12 h-fit mt-4">
                            <h2 className="text-3xl sm:text-4xl font-serif tracking-wide text-center mb-8 sm:mb-12 text-white/90">{ui.reviewTitle || T.en.reviewTitle}</h2>
                            
                            <div className="space-y-6 sm:space-y-8 mb-8 sm:mb-12">
                                {SECTIONS.map((section, sIdx) => {
                                    const qList = activeQuizData[section.id];
                                    return (
                                        <div key={section.id} className="bg-black/20 rounded-2xl sm:rounded-3xl p-4 sm:p-6 border border-white/5">
                                            <h3 className="text-lg sm:text-xl font-medium mb-4 text-white/80 flex items-center gap-3">
                                                <LucideIcon name={section.icon} className="w-5 h-5 text-cyan-400" />
                                                {translatedSections[sIdx].title}
                                            </h3>
                                            <div className="flex flex-wrap gap-2 sm:gap-3">
                                                {qList.map((q, qIdx) => {
                                                    const isAns = answers[q.id] !== undefined;
                                                    return (
                                                        <button 
                                                            key={q.id}
                                                            onClick={() => {
                                                                playSound('click');
                                                                setCurrentSectionIdx(sIdx);
                                                                setCurrentQuestionIdx(qIdx);
                                                                setAppState('playing');
                                                            }}
                                                            className={`w-10 h-10 sm:w-12 sm:h-12 rounded-lg sm:rounded-xl font-bold text-base sm:text-lg flex items-center justify-center transition-all hover:scale-110 ${isAns ? 'bg-green-500/20 text-green-400 border border-green-500/30 shadow-[0_0_10px_rgba(34,197,94,0.2)]' : 'bg-white/5 text-white/40 border border-white/10 hover:bg-white/20'}`}
                                                        >
                                                            {qIdx + 1}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="flex flex-col sm:flex-row justify-center gap-4 mt-8">
                                <button 
                                    onClick={() => { playSound('click'); setAppState('playing'); }}
                                    className="px-6 sm:px-8 py-3 sm:py-5 bg-white/5 hover:bg-white/10 text-white font-bold text-base sm:text-xl rounded-xl sm:rounded-2xl transition-all border border-white/10 flex items-center justify-center gap-2"
                                >
                                    <LucideIcon name="arrow-left" className="w-5 h-5" />
                                    {ui.backToQuiz || T.en.backToQuiz}
                                </button>
                                <button 
                                    onClick={handleFinalSubmitClick}
                                    className="px-8 sm:px-12 py-3 sm:py-5 bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold text-base sm:text-xl rounded-xl sm:rounded-2xl shadow-[0_0_30px_rgba(34,211,238,0.4)] transition-all hover:-translate-y-1 flex items-center justify-center gap-2"
                                >
                                    <LucideIcon name="check-circle" className="w-5 h-5" />
                                    {ui.finalSubmit || T.en.finalSubmit}
                                </button>
                            </div>
                        </div>
                        </div>
                        {exitModalJSX}
                        {submitModalJSX}
                    </div>
                );
            }

            if (appState === 'results') {
                const score = calculateTotalScore();
                return (
                    <div className="min-h-screen w-full text-white font-sans flex items-center justify-center relative overflow-hidden">
                        <DefaultAppBackground />
                        <GlowOrb color="bg-green-600" top="-10%" left="-10%" delay="0s" />
                        
                        <div className="z-10 glass-panel-card p-8 sm:p-12 max-w-lg text-center mx-4 w-full">
                            <LucideIcon name="check-circle-2" className="w-20 h-20 sm:w-24 sm:h-24 text-green-400 mx-auto mb-6" />
                            <h1 className="text-3xl sm:text-4xl font-bold mb-2">{ui.complete}</h1>
                            <p className="text-white/70 mb-8">{ui.subtitle}</p>
                            
                            <div className="bg-black/20 rounded-2xl p-6 mb-8">
                                <div className="text-5xl sm:text-6xl font-black text-cyan-400 mb-2">
                                    {score} <span className="text-xl sm:text-2xl text-white/50">/ {totalQuestions}</span>
                                </div>
                                <p className="text-base sm:text-lg">{ui.percentage}: {Math.round((score/totalQuestions)*100)}%</p>
                            </div>
                            
                            <div className="flex flex-col gap-4 mt-8">
                                <button onClick={() => { playSound('click'); setAppState('analysis'); }} className="flex items-center justify-center w-full gap-2 bg-blue-500 hover:bg-blue-400 text-slate-900 py-3 sm:py-4 rounded-xl transition-colors font-bold text-base sm:text-lg shadow-[0_0_20px_rgba(59,130,246,0.3)] hover:-translate-y-1">
                                    <LucideIcon name="bar-chart-2" className="w-5 h-5" /> {ui.analyseBtn || T.en.analyseBtn}
                                </button>
                                <button onClick={() => { playSound('click'); setAppState('start'); }} className="flex items-center justify-center w-full gap-2 bg-white/10 hover:bg-white/20 border border-white/20 py-3 sm:py-4 rounded-xl transition-colors font-semibold text-sm sm:text-base">
                                    <LucideIcon name="refresh-cw" className="w-4 h-4 sm:w-5 sm:h-5" /> {ui.retake}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // At this point we are guaranteed to be in 'playing' state with activeQuizData loaded.
            const selectedIdx = answers[currentQuestion.id];
            const qIconName = currentQuestion.icon || 'help-circle'; 
            const isLastQuestionInSection = currentQuestionIdx === questionsList.length - 1;
            const isLastSection = currentSectionIdx === SECTIONS.length - 1;

            let mainActionText = ui.nextQuestion || T.en.nextQuestion;
            if (isLastQuestionInSection && !isLastSection) mainActionText = ui.submitSection || T.en.submitSection;
            if (isLastQuestionInSection && isLastSection) mainActionText = ui.reviewBtn || T.en.reviewBtn;

            return (
                <div className="min-h-screen w-full text-white font-sans flex justify-center p-4 sm:p-6 pt-24 pb-12 relative overflow-x-hidden">
                    <DefaultAppBackground />

                    {renderTopNav(true, handleBackClick, ui.back)}

                    <SpringSlider />

                    <div className="relative z-10 w-full max-w-[1400px] h-auto flex flex-col lg:flex-row gap-6 mt-4">
                        
                        {/* Main Question Panel */}
                        <div className="flex-1 flex flex-col glass-panel-card p-6 sm:p-10 relative overflow-hidden">
                            <div className="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent pointer-events-none rounded-3xl sm:rounded-[40px]"></div>

                            <div className="flex flex-col xl:flex-row justify-between items-center xl:items-start gap-6 mb-8 relative z-10">
                                {/* NEW SECTION NAVIGATOR (Near Questions) */}
                                <div className="flex items-center gap-1 bg-black/20 p-1.5 rounded-2xl border border-white/10 w-full sm:w-fit shrink-0 overflow-hidden">
                                    <button 
                                        onClick={() => { playSound('click'); setCurrentSectionIdx(Math.max(0, currentSectionIdx - 1)); setCurrentQuestionIdx(0); }} 
                                        disabled={currentSectionIdx === 0}
                                        className={`p-2 rounded-xl transition-colors shrink-0 ${currentSectionIdx === 0 ? 'text-white/20 cursor-not-allowed' : 'text-white/60 hover:text-white hover:bg-white/10'}`}
                                    >
                                        <LucideIcon name="chevron-left" className="w-4 h-4 sm:w-5 sm:h-5" />
                                    </button>
                                    <div className="flex flex-col items-center px-2 sm:px-4 flex-1 sm:min-w-[200px] overflow-hidden">
                                        <span className="text-[10px] sm:text-xs text-cyan-400 font-bold tracking-widest uppercase mb-0.5 sm:mb-1">
                                            Section {currentSectionIdx + 1}
                                        </span>
                                        <h2 className="text-sm sm:text-lg md:text-xl font-serif tracking-wide text-white/90 text-center truncate w-full">
                                            {translatedSections[currentSectionIdx].title.toUpperCase()}
                                        </h2>
                                    </div>
                                    <button 
                                        onClick={() => { playSound('click'); setCurrentSectionIdx(Math.min(SECTIONS.length - 1, currentSectionIdx + 1)); setCurrentQuestionIdx(0); }} 
                                        disabled={currentSectionIdx === SECTIONS.length - 1}
                                        className={`p-2 rounded-xl transition-colors shrink-0 ${currentSectionIdx === SECTIONS.length - 1 ? 'text-white/20 cursor-not-allowed' : 'text-white/60 hover:text-white hover:bg-white/10'}`}
                                    >
                                        <LucideIcon name="chevron-right" className="w-4 h-4 sm:w-5 sm:h-5" />
                                    </button>
                                </div>
                                
                                {/* Unrestricted Q-Nav */}
                                <div className="bg-black/40 backdrop-blur-md border border-white/10 rounded-[2rem] flex items-center p-1.5 shadow-lg w-full xl:w-fit max-w-full overflow-hidden">
                                    <button onClick={handlePrev} className="p-2 hover:bg-white/10 rounded-full text-white/60 hover:text-white transition-colors shrink-0 hidden sm:block">
                                        <LucideIcon name="chevron-left" className="w-4 h-4 sm:w-5 sm:h-5" />
                                    </button>
                                    
                                    <div className="flex flex-wrap justify-center gap-1 sm:gap-1.5 px-1 sm:px-2 flex-1">
                                        {questionsList.map((_, i) => {
                                            const displayNum = i + 1;
                                            const isActive = i === currentQuestionIdx;
                                            return (
                                                <button key={i} onClick={() => { playSound('click'); setCurrentQuestionIdx(i); }} className={`w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center rounded-full text-xs sm:text-sm font-medium transition-all ${isActive ? 'bg-white/20 text-white' : 'text-white/40 hover:text-white/80 hover:bg-white/5'}`}>
                                                    Q{displayNum}
                                                </button>
                                            )
                                        })}
                                    </div>

                                    <button onClick={handleNextArrow} className="p-2 hover:bg-white/10 rounded-full text-white/60 hover:text-white transition-colors shrink-0 hidden sm:block">
                                        <LucideIcon name="chevron-right" className="w-4 h-4 sm:w-5 sm:h-5" />
                                    </button>
                                </div>
                            </div>

                            {/* Flexible Question Container - NO SCROLLBAR HERE */}
                            <div className="relative z-10 bg-white/5 border border-white/10 rounded-2xl sm:rounded-3xl p-5 sm:p-8 mb-6 sm:mb-8 flex-1 shadow-inner">
                                <div className="flex flex-col-reverse md:flex-row justify-between items-center md:items-start gap-6 sm:gap-8">
                                    <div className="flex-1 w-full text-center md:text-left">
                                        <p className="text-lg sm:text-2xl leading-relaxed text-white/90 font-medium">
                                            <span className="font-bold text-cyan-300 mr-2">Q.</span>{translatedCurrentQuestion.text}
                                        </p>
                                    </div>
                                    
                                    <div className="w-24 h-24 sm:w-32 sm:h-32 md:w-48 md:h-48 bg-black/20 rounded-2xl flex items-center justify-center shrink-0 border border-white/5 relative overflow-hidden group">
                                        <LucideIcon name={qIconName} className="w-12 h-12 sm:w-16 sm:h-16 md:w-24 md:h-24 text-cyan-200 opacity-80 group-hover:scale-110 group-hover:text-cyan-100 transition-all duration-500 animate-[pulse_3s_ease-in-out_infinite]" />
                                    </div>
                                </div>
                            </div>

                            {/* Randomized Options Grid */}
                            <div className="grid grid-cols-1 xl:grid-cols-2 gap-3 sm:gap-5 relative z-10 mb-8">
                                {currentQuestion.shuffledIndices.map((originalIdx, renderIdx) => {
                                    const optText = translatedCurrentQuestion.options[originalIdx];
                                    const isSelected = selectedIdx === originalIdx;
                                    return (
                                        <button key={originalIdx} onClick={() => handleSelectOption(originalIdx)} className={`relative overflow-hidden group flex items-center p-4 sm:p-5 rounded-xl sm:rounded-2xl text-left transition-all duration-300 border ${isSelected ? 'bg-cyan-900/40 border-cyan-400 shadow-[0_0_20px_rgba(34,211,238,0.3)]' : 'bg-white/5 border-white/10 hover:bg-white/10 hover:border-white/30'}`}>
                                            <div className="absolute inset-0 bg-gradient-to-r from-white/0 via-white/5 to-white/0 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700 pointer-events-none"></div>
                                            <span className={`w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center mr-3 sm:mr-4 text-sm sm:text-lg font-semibold shrink-0 transition-colors ${isSelected ? 'bg-cyan-500/20 text-cyan-300' : 'bg-white/10 text-white/60'}`}>{renderIdx + 1}</span>
                                            <span className={`text-sm sm:text-lg leading-tight sm:leading-normal ${isSelected ? 'text-white' : 'text-white/80'}`}>{optText}</span>
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Always Active Main Action Button */}
                            <div className="flex justify-end relative z-10 mt-auto">
                                <button 
                                    onClick={handleMainAction}
                                    className="w-full sm:w-auto px-8 sm:px-10 py-3 sm:py-4 rounded-xl sm:rounded-2xl font-bold text-base sm:text-lg flex items-center justify-center gap-3 transition-all duration-300 bg-cyan-500 text-slate-900 shadow-[0_0_25px_rgba(34,211,238,0.5)] hover:bg-cyan-400 hover:shadow-[0_0_35px_rgba(34,211,238,0.7)] hover:-translate-y-1"
                                >
                                    {mainActionText}
                                    <LucideIcon name={mainActionText === (ui.reviewBtn || T.en.reviewBtn) ? "clipboard-check" : "arrow-right"} className="w-5 h-5" />
                                </button>
                            </div>
                        </div>

                        {/* Sticky Sidebar */}
                        <div className="w-full lg:w-[380px] flex flex-col gap-6 sticky top-24 self-start">
                            <div className="glass-panel-card p-6 sm:p-8">
                                <h3 className="text-xs sm:text-sm text-white/50 uppercase tracking-widest mb-4 sm:mb-6 font-semibold">{ui.sections}</h3>
                                <div className="flex flex-col gap-3 sm:gap-4">
                                    {translatedSections.map((section, idx) => {
                                        const isActive = currentSectionIdx === idx;
                                        return (
                                            <button key={section.id} onClick={() => { playSound('click'); setCurrentSectionIdx(idx); setCurrentQuestionIdx(0); }} className={`flex items-center gap-3 sm:gap-4 p-2.5 sm:p-3 rounded-xl sm:rounded-2xl transition-all text-left ${isActive ? 'bg-white/15 border border-white/20 shadow-md' : 'hover:bg-white/5 border border-transparent'}`}>
                                                <div className={`p-2 rounded-lg sm:rounded-xl ${isActive ? 'bg-cyan-500/20 text-cyan-300' : 'bg-black/20 text-white/50'}`}>
                                                    <LucideIcon name={section.icon} className="w-4 h-4 sm:w-5 sm:h-5" />
                                                </div>
                                                <span className={`text-xs sm:text-sm leading-tight ${isActive ? 'text-white font-medium' : 'text-white/60'}`}>{section.title}</span>
                                            </button>
                                        )
                                    })}
                                </div>
                            </div>

                            <div className="glass-panel-card p-6 sm:p-8">
                                <h3 className="text-lg sm:text-xl font-medium mb-4 sm:mb-6">{ui.quizProgress}</h3>
                                <div className="space-y-3 sm:space-y-4">
                                    <div className="flex justify-between items-center text-xs sm:text-sm">
                                        <span className="text-white/60">{ui.questionsDone}:</span>
                                        <span className="font-mono text-sm sm:text-base">{answeredCount} / {totalQuestions}</span>
                                    </div>
                                    <div className="flex justify-between items-center text-xs sm:text-sm">
                                        <span className="text-white/60">{ui.timeMode}:</span>
                                        <span className="font-mono text-sm sm:text-base text-cyan-300">{mode === 'timed' ? formatTime(timeRemaining) : ui.zenMode}</span>
                                    </div>
                                    <button 
                                        onClick={() => { playSound('click'); setAppState('review'); }}
                                        className="w-full mt-2 sm:mt-4 py-2.5 sm:py-3 rounded-lg sm:rounded-xl border border-white/20 bg-white/5 hover:bg-white/10 transition-colors text-xs sm:text-sm font-medium flex items-center justify-center gap-2"
                                    >
                                        <LucideIcon name="clipboard-list" className="w-4 h-4" />
                                        {ui.reviewBtn || T.en.reviewBtn}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    {exitModalJSX}
                    {submitModalJSX}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
